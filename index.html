<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#155eef">
  <meta name="description" content="군산열린학원 학생을 위한 수학·영어 AI 학습 도우미">
  <meta name="referrer" content="no-referrer">
  <title>열린AIT | 군산열린학원</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
  <main class="app-shell">
    <header class="brand">
      <img src="./icon.png" alt="" class="app-logo" width="76" height="76">
      <div><p class="academy-name">군산열린학원</p><h1>열린AIT</h1></div>
    </header>
    <p class="intro">모르는 수학 문제나 영어 문장을 찍으면 풀이 과정을 차근차근 설명해 드려요.</p>
    <button id="installAppBtn" class="button install-button" type="button" hidden>내 폰에 앱 설치하기</button>

    <section class="access-panel" aria-labelledby="access-title">
      <h2 id="access-title">학원 이용 코드</h2>
      <label for="accessCode" class="sr-only">학원 이용 코드</label>
      <input id="accessCode" type="password" autocomplete="off" maxlength="20" placeholder="선생님께 받은 코드 입력">
    </section>

    <section class="privacy-notice">
      <h2>사진을 올리기 전에 확인해 주세요</h2>
      <p>사진은 문제 풀이를 위해 AI 서비스로 전송됩니다. 이름, 얼굴, 학교명, 전화번호가 보이지 않게 문제 부분만 잘라 주세요.</p>
      <label class="consent-row"><input id="privacyConsent" type="checkbox"><span>사진 전송 안내를 확인했습니다.</span></label>
    </section>

    <div id="uploadButtonsGroup" class="upload-actions">
      <label class="button primary-button"><span>📷 문제 촬영하기</span><input type="file" id="cameraInput" accept="image/jpeg,image/png,image/webp" capture="environment"></label>
      <label class="button secondary-button"><span>사진에서 고르기</span><input type="file" id="galleryInput" accept="image/jpeg,image/png,image/webp"></label>
    </div>

    <section id="cropperContainer" class="crop-panel" aria-label="문제 부분 자르기" hidden>
      <p class="crop-help">문제 부분만 네모 안에 맞춰 주세요.</p>
      <div class="crop-frame"><img id="imageToCrop" alt="선택한 문제 사진"></div>
      <div class="row-actions">
        <button class="button ghost-button" id="cancelCropBtn" type="button">취소</button>
        <button class="button primary-button" id="doCropBtn" type="button">이 부분 풀이하기</button>
      </div>
    </section>

    <div id="loadingMessage" class="loading" role="status" aria-live="polite" hidden><span class="spinner" aria-hidden="true"></span><span>문제를 읽고 풀이를 준비하고 있어요.</span></div>
    <section id="resultArea" aria-live="polite"></section>
    <button id="newQuestionBtn" class="button secondary-button" type="button" hidden>다른 문제 질문하기</button>
  </main>
  <footer>열린AIT의 답변은 학습을 돕기 위한 참고 자료입니다.</footer>
  <script src="./config.js"></script>
  <script src="./app.js" defer></script>
</body>
</html>
