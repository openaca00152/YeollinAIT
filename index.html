<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>열린AIT - 군산열린학원 AI 튜터</title>
    
    <link rel="manifest" href="manifest.json">
    
    <!-- 아이폰(iOS) 전용 앱 설치 및 UI 세팅 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="열린AIT">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- 폰트 및 라이브러리 로드 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <script id="MathJax-script" async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js"></script>
    
    <!-- 이미지 자르기(Cropper.js) 라이브러리 추가 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <style>
        body {
            background-color: #f4f6f8; margin: 0; padding: 20px;
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; box-sizing: border-box;
        }
        .app-container {
            width: 100%; max-width: 400px;
            background: white; padding: 40px 25px; 
            border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            font-family: 'Pretendard Variable', sans-serif; text-align: center;
        }
        .app-logo { width: 80px; height: 80px; border-radius: 20px; object-fit: cover; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .header { color: #111; font-size: 2.2em; font-weight: 800; margin: 0 0 10px 0; }
        .subtitle { font-size: 1.1em; color: #555; margin: 0 0 25px 0; word-break: keep-all; }
        
        .btn-common {
            display: block; width: 100%; padding: 18px; 
            border-radius: 15px; cursor: pointer; 
            font-size: 1.1em; font-weight: 800; border: none;
            box-sizing: border-box; transition: 0.2s; margin-bottom: 15px; text-align: center; color: white;
        }
        
        #installAppBtn { background: #28a745; display: none; }
        #installAppBtn:hover { background: #218838; }

        .upload-btn { background: #4A90E2; margin-bottom: 0; }
        .upload-btn:hover { background-color: #357ABD; }
        input[type="file"] { display: none; }
        
        #loadingMessage { display: none; color: #4A90E2; font-weight: bold; font-size: 1.1em; margin-top: 25px; }
        
        /* 자르기 영역 디자인 */
        #cropperContainer { display: none; margin-top: 20px; text-align: center; }
        #imageToCrop { max-width: 100%; max-height: 400px; display: block; margin: 0 auto; }
        .action-btns { display: flex; gap: 10px; margin-top: 15px; }
        .crop-btn, .cancel-btn {
            flex: 1; padding: 15px; border: none; border-radius: 12px;
            font-size: 1.1em; font-weight: bold; cursor: pointer; color: white;
        }
        .crop-btn { background: #ff4757; }
        .cancel-btn { background: #a4b0be; }

        /* 답변 영역 디자인 (수식 띄어쓰기 개선 반영) */
        #resultArea { font-family: 'Noto Serif KR', serif; font-size: 1.05em; line-height: 1.8; word-break: keep-all; width: 100%; text-align: left; }
        .box { background: #fdfaf2; padding: 25px; border-radius: 12px; border-left: 5px solid #ffc107; margin-top: 30px; color: #222; white-space: normal; }
        .highlight-blue { color: #0056b3; font-weight: bold; }
        .highlight-red { color: #d32f2f; font-weight: bold; }
        
        .listen-btn { background: #28a745; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; margin-top: 10px; display: block; font-weight: bold; font-size: 0.95em; }
    </style>
</head>
<body>

    <div class="app-container">
        <img src="icon.png" alt="열린AIT 로고" class="app-logo">
        <h2 class="header">열린AIT 💡</h2>
        <p class="subtitle">모르는 문제나 문장을<br>사진으로 찍어주세요!</p>
        
        <!-- 앱 설치 버튼 -->
        <button id="installAppBtn" class="btn-common">📲 내 폰에 앱으로 설치하기</button>

        <!-- 사진 찍기 / 업로드 버튼 -->
        <label class="upload-btn btn-common" id="uploadLabel">
            📸 사진 찍기 / 업로드
            <input type="file" id="imageInput" accept="image/*" capture="environment">
        </label>

        <!-- 자르기 도구 영역 -->
        <div id="cropperContainer">
            <div style="max-height: 400px; overflow: hidden; border-radius: 10px; border: 2px solid #ddd;">
                <img id="imageToCrop" src="" alt="자르기 이미지">
            </div>
            <div class="action-btns">
                <button class="cancel-btn" id="cancelCropBtn">취소</button>
                <button class="crop-btn" id="doCropBtn">✂️ 이 부분만 분석</button>
            </div>
        </div>

        <div id="loadingMessage">AI 선생님이 분석 중입니다... ⏳</div>
        <div id="resultArea"></div>
    </div>

    <script>
        // ⭐ 복사하신 진짜 키를 여기에 쏙 넣어주세요!
        const API_KEY = 'AQ.Ab8RN6IUsLx140Z3JUo6-Cvs-jEkvOMbhbFV-DVW958KBYmI3g'; 

        // === 앱 설치 버튼 로직 ===
        const installAppBtn = document.getElementById('installAppBtn');
        let deferredPrompt;
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (!isStandalone) installAppBtn.style.display = 'block';
        });

        if (isIOS && !isStandalone) {
            installAppBtn.style.display = 'block';
        }

        installAppBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installAppBtn.style.display = 'none';
                deferredPrompt = null;
            } else if (isIOS) {
                alert("🍎 아이폰 앱 설치 방법 🍎\n\n1. 화면 맨 아래의 [공유(네모 위로 화살표)] 버튼을 누르세요.\n2. 메뉴를 조금 내려서 [홈 화면에 추가]를 선택해 주세요!");
            }
        });

        // === 이미지 자르기 및 AI 통신 로직 ===
        let cropper = null;
        const imageInput = document.getElementById('imageInput');
        const cropperContainer = document.getElementById('cropperContainer');
        const imageToCrop = document.getElementById('imageToCrop');
        const uploadLabel = document.getElementById('uploadLabel');
        const cancelCropBtn = document.getElementById('cancelCropBtn');
        const doCropBtn = document.getElementById('doCropBtn');
        const resultArea = document.getElementById('resultArea');
        const loadingMessage = document.getElementById('loadingMessage');

        // 사진이 선택(또는 촬영)되면 실행됨
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                imageToCrop.src = event.target.result;
                uploadLabel.style.display = 'none'; 
                installAppBtn.style.display = 'none'; 
                resultArea.innerHTML = ''; 
                cropperContainer.style.display = 'block'; 
                
                if (cropper) cropper.destroy();
                cropper = new Cropper(imageToCrop, {
                    viewMode: 1, autoCropArea: 0.8, background: false,
                });
            };
            reader.readAsDataURL(file);
            e.target.value = ''; // 재촬영 가능하도록 초기화
        });

        // 취소 버튼 누름
        cancelCropBtn.addEventListener('click', () => {
            cropperContainer.style.display = 'none';
            uploadLabel.style.display = 'block';
            if (!isStandalone) installAppBtn.style.display = 'block';
            if (cropper) cropper.destroy();
        });

        // 자르기 완료 후 AI에게 분석 요청
        doCropBtn.addEventListener('click', async () => {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas({ width: 800 }); 
            const base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

            cropperContainer.style.display = 'none';
            loadingMessage.style.display = 'block';
            if (cropper) cropper.destroy();

            try {
                // 수식 띄어쓰기 개선 프롬프트 적용
                const prompt = `
                너는 '군산열린학원'의 친절하고 똑똑한 수학/영어 선생님 '열린AIT'야.
                학생이 올린 사진을 분석해서 아래 규칙에 따라 HTML 태그로만 답변해. 절대 \`\`\`html 같은 코드블록 기호를 쓰지 마.
                
                [공통 규칙]
                1. 학생이 스마트폰으로 읽기 편하도록, 문맥이 끊기지 않게 자연스러운 문장으로 설명하고 단락별로 <br><br>을 적절히 써서 줄바꿈 해줘.
                2. 전체 답변은 <div class="box"> 태그로 감싸.

                [수학 문제인 경우]
                1. 정답과 함께 단계별 풀이 과정을 친절하게 설명해.
                2. ⭐중요⭐ 문장 안에 섞여 있는 기호나 짧은 수식은 반드시 \\( 와 \\) 기호로 감싸서 글자처럼 이어지게(인라인) 작성해. (예: 다항함수 \\(f(x)\\)의 최솟값은...)
                3. 길고 복잡한 수식이나 결론만 $$ 기호로 감싸서 가운데 정렬되게 해. (예: $$x^2 - 5x + 6 = 0$$)
                4. 핵심 원리나 정답은 <span class="highlight-red"> 또는 <span class="highlight-blue"> 로 감싸서 색상을 줘.

                [영어 문제인 경우]
                1. 사진 속 영어 문장을 파악해서 가장 상단에 <p id="eng-text" style="font-size:1.1em; font-weight:bold;">[영어 원문]</p> 형식으로 적어.
                2. 원문 바로 밑에 다음 코드를 넣어: <button class="listen-btn" onclick="speakEnglish(document.getElementById('eng-text').innerText)">🔊 미국식 발음 듣기</button>
                3. 한글 해석을 제공하고, 핵심 영문법이나 단어를 번호 매겨 설명해. 중요 부분은 span 태그로 강조해.
                `;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-pro-preview:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: prompt },
                                { inline_data: { mime_type: 'image/jpeg', data: base64Image } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error.message || '오류가 발생했습니다.');

                let aiText = data.candidates[0].content.parts[0].text;
                aiText = aiText.replace(/```html/g, '').replace(/```/g, '');

                loadingMessage.style.display = 'none';
                uploadLabel.style.display = 'block'; 
                resultArea.innerHTML = aiText;

                if (window.MathJax) MathJax.typesetPromise();

            } catch (error) {
                console.error(error);
                loadingMessage.style.display = 'none';
                uploadLabel.style.display = 'block';
                resultArea.innerHTML = `<p style="color:red; text-align:center;">오류: ${error.message}</p>`;
            }
        });

        // 영어 음성 듣기 기능
        window.speakEnglish = function(text) {
            if (!window.speechSynthesis) return alert("기기에서 음성을 지원하지 않습니다.");
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US'; utterance.rate = 0.85; 
            window.speechSynthesis.speak(utterance);
        };
    </script>

    <!-- 서비스 워커(sw.js) 연결 -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('서비스 워커 실패:', err));
            });
        }
    </script>
</body>
</html>
